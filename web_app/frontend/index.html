<!DOCTYPE html>
<html>
<head>
    <title>LLM Training Admin App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            padding: 20px;
        }
        h1 {
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #terminal-container {
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: monospace;
        }
        #terminal-output {
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #333;
            background-color: #000;
        }
        #terminal-input-container {
            display: flex;
        }
        #cmd-input {
            flex-grow: 1;
            padding: 5px;
            border: 1px solid #555;
            border-radius: 3px;
            background-color: #252526;
            color: #d4d4d4;
            font-family: monospace;
        }
        #cmd-input:focus {
            outline: none;
            border-color: #007acc;
        }
        .term-btn {
            margin-left: 5px;
        }

        .dashboard {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .dashboard button {
            background-color: var(--tg-theme-button-color, #4CAF50);
        }
</style>
</head>
<body>
    <h1>Welcome to LLM Training Admin App</h1>
    <div id="user-info"></div>

    <div id="auth-container" style="margin-top: 20px; border: 1px solid #ccc; border-radius: 5px; padding: 10px; background-color: var(--tg-theme-bg-color, #f9f9f9);">
        <h3>Authentication</h3>
        <input type="password" id="api-key-input" placeholder="Enter API Key" style="padding: 5px; width: 200px;">
        <button onclick="saveApiKey()">Save Key</button>
        <span id="auth-status" style="margin-left: 10px; color: gray;">No key saved</span>
    </div>

    <div id="config-container" style="margin-top: 20px; border: 1px solid #ccc; border-radius: 5px; padding: 10px; background-color: var(--tg-theme-bg-color, #f9f9f9);">
        <h3>Configuration Settings</h3>
        <div style="display: flex; flex-direction: column; gap: 10px; max-width: 300px;">
            <label>
                Config Name:
                <input type="text" id="config-name" placeholder="e.g. my_experiment" />
            </label>
            <label>
                Epochs:
                <input type="number" id="config-epochs" value="5" />
            </label>
            <label>
                Batch Size:
                <input type="number" id="config-batch-size" value="16" />
            </label>
            <label>
                Learning Rate:
                <input type="number" id="config-lr" step="0.0001" value="0.0001" />
            </label>
            <button onclick="saveConfig()">Save Config</button>
        </div>

        <hr style="margin: 15px 0;">
        <h4>Quick Launch</h4>
        <div style="display: flex; flex-direction: column; gap: 10px; max-width: 300px;">
            <label>
                Select Config:
                <select id="quick-launch-select">
                    <option value="">-- Loading... --</option>
                </select>
            </label>
            <button onclick="quickLaunch()" style="background-color: var(--tg-theme-button-color, #f39c12);">Quick Launch</button>
        </div>
    </div>

    <div class="dashboard">
        <button onclick="runScript('pretraining')">Pretraining</button>
        <button onclick="runScript('finetuning')">Fine-tuning</button>
        <button onclick="runScript('evaluation')">Evaluation</button>
    </div>

    <div id="inference-container" style="margin-top: 20px; border: 1px solid #ccc; border-radius: 5px; padding: 10px; background-color: var(--tg-theme-bg-color, #f9f9f9);">
        <h3>Inference / Testing</h3>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <label>
                Prompt:
                <textarea id="inference-prompt" rows="3" style="width: 100%; border-radius: 4px; padding: 5px;" placeholder="Enter your text here..."></textarea>
            </label>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <label>
                    Max Tokens:
                    <input type="number" id="inference-max-tokens" value="20" style="width: 60px;" />
                </label>
                <label>
                    Temperature:
                    <input type="number" id="inference-temperature" step="0.1" value="0.7" style="width: 60px;" />
                </label>
                <label>
                    Model Path:
                    <input type="text" id="inference-model-path" placeholder="e.g. pretrained_llm.pth" style="width: 150px;" />
                </label>
            </div>
            <button onclick="runInference()" style="background-color: var(--tg-theme-button-color, #9b59b6); width: fit-content;">Generate</button>
            <div id="inference-output" style="margin-top: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; min-height: 50px; background-color: #fff; color: #000; white-space: pre-wrap;"></div>
        </div>
    </div>

    <div id="metrics-container" style="padding: 15px; margin: 15px 0; border: 1px solid var(--tg-theme-hint-color, #ccc); border-radius: 8px;">
        <h3>Визуализация (Metrics)</h3>
        <button onclick="loadMetrics()">Load Metrics</button>
        <canvas id="metricsChart" width="400" height="200" style="margin-top: 15px; display: none;"></canvas>
    </div>

    <div id="artifacts-container" style="padding: 15px; margin: 15px 0; border: 1px solid var(--tg-theme-hint-color, #ccc); border-radius: 8px;">
        <h3>Артефакты (Artifacts)</h3>
        <button onclick="loadArtifacts()">Load Artifacts</button>
        <div id="artifacts-list" style="margin-top: 15px; max-height: 300px; overflow-y: auto;">
            <p style="color: gray;">No artifacts loaded yet.</p>
        </div>
    </div>

    <div id="export-container" style="padding: 15px; margin: 15px 0; border: 1px solid var(--tg-theme-hint-color, #ccc); border-radius: 8px;">
        <h3>Экспорт на HuggingFace (Export)</h3>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <label>
                Model Path:
                <input type="text" id="hf-model-path" placeholder="e.g. checkpoints_finetune/model.pth" style="width: 100%;" />
            </label>
            <label>
                HF Token:
                <input type="password" id="hf-token" placeholder="HuggingFace API Token" style="width: 100%;" />
            </label>
            <label>
                Repo ID:
                <input type="text" id="hf-repo-id" placeholder="e.g. username/repo-name" style="width: 100%;" />
            </label>
            <button onclick="exportModel()" style="background-color: var(--tg-theme-button-color, #e67e22); width: fit-content;">Export to HF</button>
            <div id="export-output" style="margin-top: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; min-height: 20px; background-color: #fff; color: #000;"></div>
        </div>
    </div>

    <div id="terminal-container">

        <h3>Terminal</h3>
        <div id="terminal-output"></div>
        <div id="terminal-input-container">
            <input type="text" id="cmd-input" placeholder="Enter command (e.g., ls -la)" />
            <button class="term-btn" onclick="executeCommand()">Run</button>
            <button class="term-btn" onclick="clearTerminal()">Clear</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        window.Telegram.WebApp.ready();

        const initDataUnsafe = window.Telegram.WebApp.initDataUnsafe || {};

        function getApiKey() {
            return localStorage.getItem('api_key') || '';
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value;
            localStorage.setItem('api_key', key);
            document.getElementById('auth-status').textContent = 'Key saved!';
            document.getElementById('auth-status').style.color = 'green';
            connectWebSocket(); // Reconnect websocket with new key
        }

        // Modified fetch to include auth headers and handle 401/403
        async function fetchWithAuth(url, options = {}) {
            const apiKey = getApiKey();
            const headers = {
                ...options.headers,
                'X-API-Key': apiKey
            };
            const response = await fetch(url, { ...options, headers });

            if (response.status === 401) {
                appendToTerminal(`Unauthorized Access: Please check your API Key.`, 'error');
            } else if (response.status === 403) {
                appendToTerminal(`Forbidden: You do not have permission for this action.`, 'error');
            }

            return response;
        }

        // WebSocket setup for logs
        let ws;
        function connectWebSocket() {
            if (ws) {
                ws.close();
            }
            const apiKey = getApiKey();
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/logs?token=${encodeURIComponent(apiKey)}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                appendToTerminal('WebSocket connected to /ws/logs', 'command');
            };

            ws.onmessage = (event) => {
                appendToTerminal(event.data);
            };

            ws.onclose = (event) => {
                if (event.code === 1008) {
                    appendToTerminal('WebSocket disconnected: Unauthorized', 'error');
                } else {
                    appendToTerminal('WebSocket connection closed.', 'error');
                }
            };

            ws.onerror = (error) => {
                appendToTerminal(`WebSocket Error`, 'error');
            };
        }

        // Initialize token field if exists
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = getApiKey();
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
                document.getElementById('auth-status').textContent = 'Key loaded';
                document.getElementById('auth-status').style.color = 'green';
            }
            connectWebSocket();
        });

        async function loadConfigs() {
            try {
                const response = await fetchWithAuth('/api/configs');
                const data = await response.json();

                const select = document.getElementById('quick-launch-select');
                select.innerHTML = '<option value="">-- Select Config --</option>';

                if (data.file_configs && data.file_configs.length > 0) {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = "Files in configs/";
                    data.file_configs.forEach(cfg => {
                        const option = document.createElement('option');
                        option.value = cfg;
                        option.textContent = cfg;
                        optgroup.appendChild(option);
                    });
                    select.appendChild(optgroup);
                }

                if (data.experiment_configs && data.experiment_configs.length > 0) {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = "Experiment configs";
                    data.experiment_configs.forEach(cfg => {
                        const option = document.createElement('option');
                        option.value = cfg;
                        option.textContent = cfg;
                        optgroup.appendChild(option);
                    });
                    select.appendChild(optgroup);
                }
            } catch (error) {
                appendToTerminal(`Error loading configs: ${error.message}`, 'error');
            }
        }

        // Load configs on start
        loadConfigs();

        async function quickLaunch() {
            const select = document.getElementById('quick-launch-select');
            const configName = select.value;

            if (!configName) {
                appendToTerminal('Please select a config for Quick Launch.', 'error');
                return;
            }

            appendToTerminal(`> Quick Launching: ${configName}...`, 'command');
            try {
                const response = await fetchWithAuth('/api/quick_launch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config_name: configName })
                });

                const data = await response.json();
                if (!response.ok) {
                    appendToTerminal(`Error: ${data.detail}`, 'error');
                } else {
                    appendToTerminal(data.message, 'command');
                }
            } catch (error) {
                appendToTerminal(`Network Error: ${error.message}`, 'error');
            }
        }

        async function runScript(scriptType) {
            appendToTerminal(`> Starting script: ${scriptType}...`, 'command');
            try {
                const response = await fetchWithAuth('/api/run_script', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ script_type: scriptType })
                });

                const data = await response.json();
                if (!response.ok) {
                    appendToTerminal(`Error starting script: ${data.detail}`, 'error');
                } else {
                    appendToTerminal(`Process started: ${data.message}`, 'command');
                }
            } catch (error) {
                appendToTerminal(`Network Error: ${error.message}`, 'error');
            }
        }



        async function saveConfig() {
            const configName = document.getElementById('config-name').value.trim();
            const epochs = parseInt(document.getElementById('config-epochs').value, 10);
            const batchSize = parseInt(document.getElementById('config-batch-size').value, 10);
            const learningRate = parseFloat(document.getElementById('config-lr').value);

            if (!configName) {
                appendToTerminal('Error: Config name cannot be empty', 'error');
                return;
            }

            appendToTerminal(`> Saving config ${configName}...`, 'command');

            try {
                const response = await fetchWithAuth('/api/save_config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        config_name: configName,
                        epochs: epochs,
                        batch_size: batchSize,
                        learning_rate: learningRate
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    appendToTerminal(`Error saving config: ${data.detail}`, 'error');
                } else {
                    appendToTerminal(data.message, 'command');
                }
            } catch (error) {
                appendToTerminal(`Network Error: ${error.message}`, 'error');
            }
        }

        if (initDataUnsafe.user) {
            document.getElementById('user-info').innerHTML =
                `<p>Hello, ${initDataUnsafe.user.first_name}!</p>`;
        }

        const terminalOutput = document.getElementById('terminal-output');
        const cmdInput = document.getElementById('cmd-input');

        cmdInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                executeCommand();
            }
        });

        function appendToTerminal(text, type='normal') {
            const div = document.createElement('div');
            div.textContent = text;
            if (type === 'error') {
                div.style.color = '#f48771';
            } else if (type === 'command') {
                div.style.color = '#569cd6';
            }
            terminalOutput.appendChild(div);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        function clearTerminal() {
            terminalOutput.innerHTML = '';
        }

        let metricsChartInstance = null;

        async function loadMetrics() {
            try {
                appendToTerminal('> Загрузка метрик...', 'command');
                const response = await fetchWithAuth('/api/metrics');
                const data = await response.json();

                if (response.ok) {
                    appendToTerminal('Метрики успешно загружены', 'command');
                    renderChart(data);
                } else {
                    appendToTerminal(`Ошибка загрузки метрик: ${data.detail}`, 'error');
                }
            } catch (error) {
                appendToTerminal(`Network Error: ${error.message}`, 'error');
            }
        }

        async function loadArtifacts() {
            try {
                appendToTerminal('> Загрузка артефактов...', 'command');
                const response = await fetchWithAuth('/api/artifacts');
                const data = await response.json();

                const listContainer = document.getElementById('artifacts-list');
                listContainer.innerHTML = '';

                if (response.ok) {
                    appendToTerminal('Артефакты успешно загружены', 'command');
                    if (data.artifacts && data.artifacts.length > 0) {
                        const ul = document.createElement('ul');
                        ul.style.listStyleType = 'none';
                        ul.style.padding = '0';

                        data.artifacts.forEach(item => {
                            const li = document.createElement('li');
                            li.style.borderBottom = '1px solid #eee';
                            li.style.padding = '5px 0';
                            li.innerHTML = `<strong>${item.name}</strong> <span style="color: gray; font-size: 0.9em;">(${item.type})</span> - ${item.size} bytes <br> <small style="color: darkgray;">Modified: ${item.modified}</small> <br> <small style="color: darkgray;">Path: ${item.path}</small>`;
                            ul.appendChild(li);
                        });
                        listContainer.appendChild(ul);
                    } else {
                        listContainer.innerHTML = '<p style="color: gray;">No artifacts found.</p>';
                    }
                } else {
                    appendToTerminal(`Ошибка загрузки артефактов: ${data.detail}`, 'error');
                    listContainer.innerHTML = `<p style="color: red;">Error: ${data.detail}</p>`;
                }
            } catch (error) {
                appendToTerminal(`Network Error: ${error.message}`, 'error');
                document.getElementById('artifacts-list').innerHTML = `<p style="color: red;">Network Error: ${error.message}</p>`;
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('metricsChart');
            ctx.style.display = 'block';

            if (metricsChartInstance) {
                metricsChartInstance.destroy();
            }

            metricsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.epochs,
                    datasets: [
                        {
                            label: 'Loss',
                            data: data.loss,
                            borderColor: 'rgb(255, 99, 132)',
                            yAxisID: 'y',
                        },
                        {
                            label: 'Perplexity',
                            data: data.perplexity,
                            borderColor: 'rgb(54, 162, 235)',
                            yAxisID: 'y1',
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    stacked: false,
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: {
                                drawOnChartArea: false,
                            },
                        },
                    }
                }
            });
        }

        async function exportModel() {
            const modelPath = document.getElementById('hf-model-path').value.trim();
            const hfToken = document.getElementById('hf-token').value.trim();
            const repoId = document.getElementById('hf-repo-id').value.trim();
            const outputDiv = document.getElementById('export-output');

            if (!modelPath || !hfToken || !repoId) {
                outputDiv.textContent = 'Please fill all fields.';
                outputDiv.style.color = 'red';
                return;
            }

            outputDiv.textContent = 'Exporting...';
            outputDiv.style.color = 'gray';
            appendToTerminal(`> Exporting model to ${repoId}...`, 'command');

            try {
                const response = await fetchWithAuth('/api/export_model', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model_path: modelPath,
                        hf_token: hfToken,
                        repo_id: repoId
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    outputDiv.textContent = data.message;
                    outputDiv.style.color = '#000';
                    appendToTerminal('Model exported successfully', 'command');
                } else {
                    outputDiv.textContent = `Error: ${data.detail}`;
                    outputDiv.style.color = 'red';
                    appendToTerminal(`Error during export: ${data.detail}`, 'error');
                }
            } catch (error) {
                outputDiv.textContent = `Network Error: ${error.message}`;
                outputDiv.style.color = 'red';
                appendToTerminal(`Network Error during export: ${error.message}`, 'error');
            }
        }

        async function runInference() {
            const prompt = document.getElementById('inference-prompt').value.trim();
            const maxTokens = parseInt(document.getElementById('inference-max-tokens').value, 10);
            const temperature = parseFloat(document.getElementById('inference-temperature').value);
            const modelPath = document.getElementById('inference-model-path').value.trim();
            const outputDiv = document.getElementById('inference-output');

            if (!prompt) {
                outputDiv.textContent = 'Please enter a prompt.';
                outputDiv.style.color = 'red';
                return;
            }

            outputDiv.textContent = 'Generating...';
            outputDiv.style.color = 'gray';
            appendToTerminal(`> Running inference...`, 'command');

            try {
                const response = await fetchWithAuth('/api/inference', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        max_tokens: maxTokens,
                        temperature: temperature,
                        model_path: modelPath
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    outputDiv.textContent = data.generated_text;
                    outputDiv.style.color = '#000';
                    appendToTerminal('Inference completed successfully', 'command');
                } else {
                    outputDiv.textContent = `Error: ${data.detail}`;
                    outputDiv.style.color = 'red';
                    appendToTerminal(`Error during inference: ${data.detail}`, 'error');
                }
            } catch (error) {
                outputDiv.textContent = `Network Error: ${error.message}`;
                outputDiv.style.color = 'red';
                appendToTerminal(`Network Error during inference: ${error.message}`, 'error');
            }
        }

        async function executeCommand() {
            const command = cmdInput.value.trim();
            if (!command) return;

            appendToTerminal(`$ ${command}`, 'command');
            cmdInput.value = '';

            try {
                const response = await fetchWithAuth('/api/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command: command })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.stdout) appendToTerminal(data.stdout);
                    if (data.stderr) appendToTerminal(data.stderr, 'error');
                } else {
                    appendToTerminal(`Error: ${data.detail}`, 'error');
                }
            } catch (error) {
                appendToTerminal(`Network Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
